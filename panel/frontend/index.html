<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGNAL//LAYER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header id="strip">
    <button id="hamburger" title="menu">&#9776;</button>
    <div class="brand">SIGNAL<span>//</span>LAYER</div>
    <div id="regimes">
      <button id="market-read-btn" class="market-read-btn" title="full AI market read">Market Read</button>
      <button id="refresh-btn" class="market-read-btn refresh-icon" title="Re-query the AI consensus now (skip the 15-min cadence)"><span class="ric">&#8635;</span></button>
      <span id="views-age" class="views-age" title="time until the next scheduled AI refresh">—</span>
    </div>
    <div id="kpis"></div>
  </header>
  <div id="ribbon-row">
    <div id="model-sel" class="model-sel" title="model layer — drives the currency-strength ribbon">
      <button class="mbtn active" data-layer="claude">Claude</button>
      <button class="mbtn" data-layer="nemotron">Nemotron</button>
      <button class="mbtn" data-layer="deepseek">DeepSeek</button>
      <button class="mbtn" data-layer="combined">Combined</button>
    </div>
    <div id="ribbon" title="net currency strength across all pairs (long − short, confidence-weighted)"></div>
  </div>
  <nav id="navmenu" hidden>
    <button class="navitem active" data-view="dashboard">Dashboard</button>
    <button class="navitem" data-view="history">History</button>
  </nav>
  <main id="view-dashboard" class="view">
    <section class="col-left">
      <div class="card" id="equity-card"><h2>Equity Trend</h2><div id="equity-chart"></div></div>
      <div class="card" id="orders-card">
        <div class="oc-split">
          <div class="oc-col">
            <div class="oc-colhead"><h2>Positions</h2><span class="refresh-tag">&#8635; 1s</span></div>
            <div id="positions"></div></div>
          <div class="oc-col">
            <div class="oc-colhead"><h2>History</h2><span id="hist-pl" class="hist-pl"></span><button id="orders-more" class="more-btn">more &rarr;</button></div>
            <div id="orders"></div></div>
        </div>
      </div>
      <div class="card" id="controls-card"><h2>Controls</h2>
        <div class="ctl-row"><label>Preset</label>
          <select id="preset-select"></select>
          <button id="preset-apply" class="ctl-btn">Apply</button>
          <button id="preset-save" class="ctl-btn">Save</button></div>
        <div class="ctl-row"><label>Aggression</label>
          <input id="aggr" type="range" min="0" max="1" step="0.05">
          <span id="aggr-val" class="mono">—</span>
          <button id="flatten-btn" class="ctl-btn danger">Flatten now</button></div>
        <div class="ctl-row"><label>2nd opinion</label>
          <button id="so-btn" class="ctl-btn" title="Nemotron always runs and is recorded for the panel. This toggle only controls whether the ALGORITHM acts on its input (sizing). Off = Claude-only sizing, Nemotron still shown.">Nemotron input: —</button>
          <button id="ens-btn" class="ctl-btn" title="DeepSeek runs and is recorded for the panel. This toggle controls whether the ALGORITHM acts on its ensemble input (sizing). Off = DeepSeek shown only.">DeepSeek input: —</button></div>
        <div class="ctl-sep">Scalper</div>
        <div class="ctl-row"><label>Symbol</label>
          <select id="scalp-sym-sel" title="assign a symbol to the scalper (ceded from the engine)"></select>
          <button id="scalp-assign" class="ctl-btn">Assign</button></div>
        <div id="scalp-assigned" class="scalp-assigned"></div>
        <div id="ctl-status" class="ctl-status"></div>
      </div>
      <div class="card" id="gauges-card">
        <div class="card-head"><h2>Risk</h2><button id="risk-close" class="modal-close" title="close">&times;</button></div>
        <div id="gauges"></div><div id="tripwires"></div></div>
    </section>
    <section class="col-main">
      <div class="card" id="symbol-card">
        <div class="sym-head"><h2>Instrument &amp; projection</h2><div id="pinned-bar" class="pinned-bar"></div></div>
        <div class="sym-pane">
          <div class="sym-side">
            <div id="symbol-list"></div>
          </div>
          <div id="chart-wrap">
            <div id="symbol-chart"></div>
            <div id="chart-ctl">
              <div class="tf-toggle">
                <button class="tf" data-tf="1m">1m</button>
                <button class="tf active" data-tf="15m">15m</button>
                <button class="tf" data-tf="1h">1h</button>
              </div>
              <div id="chart-type" class="chart-type">
                <button class="ct active" data-ct="line" title="Line">
                  <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="3 15 9 9 13 12 21 5"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="ct" data-ct="candle" title="Candles">
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.6">
                    <line x1="8" y1="3" x2="8" y2="21"/><rect x="5.5" y="8" width="5" height="8" fill="currentColor" stroke="none"/>
                    <line x1="16" y1="5" x2="16" y2="19"/><rect x="13.5" y="10" width="5" height="6" fill="currentColor" stroke="none"/></svg>
                </button>
              </div>
            </div>
            <!-- drag a stop-loss / take-profit line -> this confirm bar appears -->
            <div id="edit-confirm" class="edit-confirm" hidden>
              <span id="edit-confirm-label"></span>
              <button id="edit-apply" class="ec-btn ec-apply" title="save">&#10003;</button>
              <button id="edit-cancel" class="ec-btn ec-cancel" title="discard">&times;</button>
            </div>
            <!-- bottom-right: create (or locate) the SL / TP line -->
            <div id="chart-ctl-b" class="chart-ctl-b">
              <button id="sl-btn" class="line-btn sl" title="set or locate the stop-loss">Stop Loss</button>
              <button id="tp-btn" class="line-btn tp" title="set or locate the take-profit">Take Profit</button>
            </div>
          </div>
        </div>
        <div id="symbol-override" class="ov-panel">
          <div class="ov-row">
            <select id="ov-dir"><option value="">AI view</option>
              <option value="long">Force LONG</option>
              <option value="short">Force SHORT</option>
              <option value="flat">Force FLAT</option></select>
            <input id="ov-conf" type="number" min="0" max="1" step="0.05" placeholder="conf">
            <button id="ov-pin" class="ctl-btn ov-pin-btn" title="pin this instrument to the top of the list">&#128204; Pin</button>
          </div>
          <div id="ov-ai" class="ov-ai"></div>
        </div>
      </div>
      <div class="card" id="consensus-card">
        <div class="card-head"><h2>Consensus</h2>
          <div id="hitrates" class="hitrates" title="per-model directional accuracy over recorded refreshes"></div>
          <div class="con-tabs">
            <button class="contab active" data-con="latest">Latest</button>
            <button class="contab" data-con="overtime">Over time</button>
          </div></div>
        <div id="con-latest" class="con-pane">
          <div class="dumb-tabs">
            <button class="dtab active" data-grp="fx">FX</button>
            <button class="dtab" data-grp="crypto">Crypto</button>
            <button class="dtab" data-grp="metals">Metals</button>
          </div>
          <div id="dumbbell"></div>
        </div>
        <div id="con-overtime" class="con-pane" hidden>
          <div class="ot-head">
            <div class="ot-layers">
              <button class="otlayer active" data-layer="claude">Claude</button>
              <button class="otlayer" data-layer="nemotron">Nemotron</button>
              <button class="otlayer" data-layer="deepseek">DeepSeek</button>
              <button class="otlayer" data-layer="combined">Combined</button>
            </div>
            <div class="dir-legend ot-legend"><span class="dl long">&#9679; long</span><span class="dl short">&#9679; short</span></div>
          </div>
          <div id="heatmap"></div>
        </div>
      </div>
    </section>
  </main>
  <section id="view-history" class="view" hidden>
    <div class="card">
      <div class="hist-head">
        <h2>History — instrument over time</h2>
        <div class="hist-controls">
          <select id="hist-symbol"></select>
          <button id="hist-back" class="ctl-btn">&larr; Dashboard</button>
        </div>
      </div>
      <div id="hist-chart"></div>
      <h2 style="margin-top:14px">Order history</h2>
      <div id="hist-orders"></div>
    </div>
  </section>
  <div id="regime-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <button id="regime-close" class="modal-close" title="close">&times;</button>
      <h3 class="modal-title">Market read — full reasoning</h3>
      <div class="rm-section claude"><div id="rm-claude" class="rm-text"></div><div class="rm-tag">CLAUDE</div></div>
      <div class="rm-section nemo"><div id="rm-nemo" class="rm-text"></div><div class="rm-tag">NEMOTRON</div></div>
      <div class="rm-section deepseek"><div id="rm-deepseek" class="rm-text"></div><div class="rm-tag">DEEPSEEK</div></div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
