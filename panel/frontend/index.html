<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGNAL//LAYER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header id="strip">
    <div class="brand">SIGNAL<span>//</span>LAYER</div>
    <div id="regimes">
      <div class="regime claude"><label>CLAUDE</label><span id="regime-claude">—</span></div>
      <div class="regime nemo"><label>NEMOTRON</label><span id="regime-nemo">—</span></div>
    </div>
    <div id="kpis"></div>
  </header>
  <main>
    <section class="col-left">
      <div class="card" id="controls-card"><h2>Controls</h2>
        <div class="ctl-row"><label>Preset</label>
          <select id="preset-select"></select>
          <button id="preset-save" class="ctl-btn">Save</button></div>
        <div class="ctl-row"><label>Aggression</label>
          <input id="aggr" type="range" min="0" max="1" step="0.05">
          <span id="aggr-val" class="mono">—</span></div>
        <div class="ctl-row">
          <button id="pause-btn" class="ctl-btn">Pause</button>
          <button id="flatten-btn" class="ctl-btn danger">Flatten now</button></div>
        <div id="ctl-status" class="ctl-status"></div>
      </div>
      <div class="card" id="equity-card"><h2>Equity Trend</h2><div id="equity-chart"></div></div>
      <div class="card" id="gauges-card"><h2>Risk</h2><div id="gauges"></div><div id="tripwires"></div></div>
      <div class="card" id="orders-card"><h2>Orders</h2><div id="orders"></div></div>
    </section>
    <section class="col-main">
      <div class="card" id="symbol-card"><h2>Instrument &amp; projection</h2>
        <div class="sym-pane">
          <div class="sym-side">
            <div class="tf-toggle">
              <button class="tf active" data-tf="15m">15m</button>
              <button class="tf" data-tf="1h">1h</button>
            </div>
            <div id="symbol-list"></div>
          </div>
          <div id="symbol-chart"></div>
        </div>
      </div>
      <div class="card" id="dumbbell-card"><h2>Consensus — latest</h2><div id="dumbbell"></div></div>
      <div class="card" id="heatmap-card"><h2>Consensus — over time</h2><div id="heatmap"></div></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
